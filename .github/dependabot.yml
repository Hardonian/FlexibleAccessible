version: 2
updates:
  # Maintain dependencies for npm (covers package.json and monorepo workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "security"
      - "dependencies"
