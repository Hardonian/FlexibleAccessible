name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Verify Codebase
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aros_user
          POSTGRES_PASSWORD: aros_password
          POSTGRES_DB: aros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://aros_user:aros_password@localhost:5432/aros_test?schema=public
        run: npm run db:generate

      - name: Push Schema & Seed
        env:
          DATABASE_URL: postgresql://aros_user:aros_password@localhost:5432/aros_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run db:push && npm run db:seed

      - name: Run Release Verification (Core + Integration)
        env:
          DATABASE_URL: postgresql://aros_user:aros_password@localhost:5432/aros_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run verify:release

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: postgresql://aros_user:aros_password@localhost:5432/aros_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run test:e2e

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
