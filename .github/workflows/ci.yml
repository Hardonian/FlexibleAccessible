name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Push DB Schema
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aros_test

      - name: Run Tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aros_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test-secret-at-least-32-characters-long
          NEXTAUTH_URL: http://localhost:3000

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aros_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test-secret-at-least-32-characters-long
          NEXTAUTH_URL: http://localhost:3000

      - name: E2E smoke
        run: npm run test:e2e --workspace=apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aros_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test-secret-at-least-32-characters-long
          NEXTAUTH_URL: http://localhost:3000
