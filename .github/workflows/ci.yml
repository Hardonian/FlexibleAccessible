name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

jobs:
  verify:
    name: Verify Codebase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies (retry on transient registry/network failures)
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed on attempt $i, retrying..."
            sleep 10
            if [ "$i" -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
          done

      - name: npm audit (high and critical must be zero)
        run: npm audit --audit-level=high

      - name: Push Schema & Seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aros_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: |
          npm run db:generate
          npm run db:push
          npm run db:seed

      - name: Run Core Verification
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aros_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run verify:core

      - name: Run Touched Route Safety Checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aros_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run verify:touched-routes

      - name: Run Tenant Boundary + Integration Verification
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aros_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run verify:tenant-boundary && npm run test:integration

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aros_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run test:e2e

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
