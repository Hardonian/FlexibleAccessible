<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="AccessibleMadeFlexible — accessibility operations and evidence">
  <title>AccessibleMadeFlexible — Accessibility operations and evidence—not vanity scores.</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4956a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b87333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5a2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="copper-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c080" />
      <stop offset="100%" style="stop-color:#d4956a" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle teal accent bar on left -->
  <rect x="0" y="0" width="8" height="630" fill="#0d9488" opacity="0.9" />

  <!-- Brand mark (large, right-side decorative) -->
  <g transform="translate(860, 140) scale(1.7)" opacity="0.12">
    <path
      d="M 100,18 C 68,18 42,40 42,68 C 42,88 55,103 74,110 C 55,117 42,132 42,152 C 42,167 55,182 100,182 C 145,182 158,167 158,152 C 158,132 145,117 126,110 C 145,103 158,88 158,68 C 158,40 132,18 100,18 Z"
      fill="none"
      stroke="#b87333"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <line x1="64" y1="110" x2="136" y2="110" stroke="#d4956a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="110" r="5" fill="#b87333" />
  </g>

  <!-- ACCESSIBLE — large, slate-100 -->
  <text
    x="72" y="210"
    font-family="'Arial Black', 'Impact', system-ui, sans-serif"
    font-size="96"
    font-weight="900"
    letter-spacing="6"
    fill="#f1f5f9"
  >ACCESSIBLE</text>

  <!-- Teal decorative lines flanking "Made" -->
  <line x1="72" y1="245" x2="320" y2="245" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
  <line x1="440" y1="245" x2="690" y2="245" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>

  <!-- Made — italic, muted -->
  <text
    x="330" y="266"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="28"
    font-weight="400"
    font-style="italic"
    letter-spacing="4"
    fill="#94a3b8"
  >Made</text>

  <!-- FLEXIBLE — large, copper gradient -->
  <text
    x="72" y="370"
    font-family="'Arial Black', 'Impact', system-ui, sans-serif"
    font-size="96"
    font-weight="900"
    letter-spacing="6"
    fill="url(#copper)"
  >FLEXIBLE</text>

  <!-- Divider -->
  <line x1="72" y1="420" x2="700" y2="420" stroke="#334155" stroke-width="1.5"/>

  <!-- Tagline -->
  <text
    x="72" y="460"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#94a3b8"
    letter-spacing="0.5"
  >Accessibility operations and evidence—not vanity scores.</text>

  <!-- Feature bullets -->
  <text x="72" y="508" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">— Browser-accurate scans and clustered root causes</text>
  <text x="72" y="538" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">— Review queues, exports, and org-scoped API keys</text>
  <text x="72" y="568" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">— Bounded draft assist · human review gates</text>

  <!-- Bottom-right: small teal brand accent -->
  <circle cx="1160" cy="590" r="20" fill="#0d9488" opacity="0.3"/>
  <circle cx="1160" cy="590" r="10" fill="#0d9488" opacity="0.6"/>
</svg>
