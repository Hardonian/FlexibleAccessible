<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img" aria-label="AccessibleMadeFlexible — stacked wordmark">
  <title>AccessibleMadeFlexible</title>
  <defs>
    <linearGradient id="copper-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4956a;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#b87333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5a2b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ACCESSIBLE — top line, dark/charcoal -->
  <text
    x="170" y="60"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', system-ui, sans-serif"
    font-size="44"
    font-weight="900"
    letter-spacing="4"
    fill="#1a1a1a"
  >ACCESSIBLE</text>

  <!-- Teal decorative rule left -->
  <line x1="18" y1="80" x2="118" y2="80" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <!-- Teal decorative rule right -->
  <line x1="222" y1="80" x2="322" y2="80" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>

  <!-- Made — centred, italic serif -->
  <text
    x="170" y="95"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="18"
    font-weight="400"
    font-style="italic"
    letter-spacing="3"
    fill="#475569"
  >Made</text>

  <!-- FLEXIBLE — bottom line, copper gradient -->
  <text
    x="170" y="160"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', system-ui, sans-serif"
    font-size="44"
    font-weight="900"
    letter-spacing="4"
    fill="url(#copper-s)"
  >FLEXIBLE</text>
</svg>
